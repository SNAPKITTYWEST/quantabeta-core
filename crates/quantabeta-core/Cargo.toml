[package]
name    = "quantabeta-core"
version = "0.1.0"
edition = "2021"
authors = ["Ahmad Ali Parr <ahmedparr93@gmail.com>"]
license = "AGPL-3.0"
description = "Symbolic feature algebra — Ramanujan partition volatility, Hecke operator correlations. Exact rational arithmetic only."

[dependencies]
rug      = { version = "1.24", features = ["rational"] }
serde    = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1"
sha2       = "0.10"
hex        = "0.4"

[dev-dependencies]
criterion = "0.5"
