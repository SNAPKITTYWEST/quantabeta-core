<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
      .bg { fill: #000; }
      .grid { stroke: #0a2a0a; stroke-width: 0.5; }
      .title { font-family: 'Share Tech Mono', monospace; fill: #00ff41; font-size: 22px; font-weight: bold; }
      .sub   { font-family: 'Share Tech Mono', monospace; fill: #00cc33; font-size: 11px; }
      .dim   { font-family: 'Share Tech Mono', monospace; fill: #005510; font-size: 10px; }
      .gold  { font-family: 'Share Tech Mono', monospace; fill: #ffd700; font-size: 11px; }
      .red   { font-family: 'Share Tech Mono', monospace; fill: #ff4444; font-size: 10px; }
      .cyan  { font-family: 'Share Tech Mono', monospace; fill: #00ffff; font-size: 10px; }
      .pipe  { stroke: #00ff41; stroke-width: 1.5; fill: none; }
      .node  { fill: #00ff41; }
      .node-dim { fill: #005510; }
      .pulse { fill: #00ff41; }
    </style>

    <!-- Scanline effect -->
    <pattern id="scanlines" x="0" y="0" width="800" height="3" patternUnits="userSpaceOnUse">
      <rect width="800" height="1" y="2" fill="rgba(0,0,0,0.15)"/>
    </pattern>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Strong glow -->
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect class="bg" width="800" height="400"/>

  <!-- Grid -->
  <g class="grid">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
  </g>

  <!-- Title -->
  <text x="400" y="45" class="title" text-anchor="middle" filter="url(#glow2)">
    QUANTABETA CORE
    <animate attributeName="opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="63" class="sub" text-anchor="middle">
    SOVEREIGN DETERMINISTIC ALPHA MINING — KILLING THE LLM ALPHA MYTH
  </text>

  <!-- Pipeline nodes -->
  <!-- Node 1 -->
  <rect x="20" y="85" width="120" height="36" rx="3" fill="#001a00" stroke="#00ff41" stroke-width="1"/>
  <text x="80" y="98" class="sub" text-anchor="middle">[1] MARKET DATA</text>
  <text x="80" y="112" class="dim" text-anchor="middle">rug::Rational only</text>

  <!-- Arrow 1→2 -->
  <line x1="140" y1="103" x2="170" y2="103" class="pipe">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dasharray" values="5,5" repeatCount="indefinite"/>
  </line>
  <polygon points="168,99 176,103 168,107" fill="#00ff41"/>

  <!-- Node 2 -->
  <rect x="176" y="85" width="140" height="36" rx="3" fill="#001a00" stroke="#00ff41" stroke-width="1"/>
  <text x="246" y="98" class="sub" text-anchor="middle">SYMBOLIC FEATURES</text>
  <text x="246" y="112" class="dim" text-anchor="middle">Ramanujan · Hecke · q-Series</text>

  <!-- Arrow 2→3 -->
  <line x1="316" y1="103" x2="346" y2="103" class="pipe">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dasharray" values="5,5" repeatCount="indefinite"/>
  </line>
  <polygon points="344,99 352,103 344,107" fill="#00ff41"/>

  <!-- Node 3 -->
  <rect x="352" y="85" width="140" height="36" rx="3" fill="#001a00" stroke="#ffd700" stroke-width="1"/>
  <text x="422" y="98" class="gold" text-anchor="middle">INVARIANT SEARCH</text>
  <text x="422" y="112" class="dim" text-anchor="middle">Haskell / LiquidHaskell</text>

  <!-- Arrow 3→4 -->
  <line x1="492" y1="103" x2="522" y2="103" class="pipe" stroke="#ffd700">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dasharray" values="5,5" repeatCount="indefinite"/>
  </line>
  <polygon points="520,99 528,103 520,107" fill="#ffd700"/>

  <!-- Node 4 -->
  <rect x="528" y="85" width="120" height="36" rx="3" fill="#001a00" stroke="#ffd700" stroke-width="1"/>
  <text x="588" y="98" class="gold" text-anchor="middle">PROLOG DCG</text>
  <text x="588" y="112" class="dim" text-anchor="middle">Factor Synthesis</text>

  <!-- Arrow 4→5 -->
  <line x1="648" y1="103" x2="678" y2="103" class="pipe" stroke="#ffd700">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1s" begin="0.9s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dasharray" values="5,5" repeatCount="indefinite"/>
  </line>
  <polygon points="676,99 684,103 676,107" fill="#ffd700"/>

  <!-- Node 5 -->
  <rect x="684" y="85" width="96" height="36" rx="3" fill="#001a00" stroke="#00ffff" stroke-width="1"/>
  <text x="732" y="98" class="cyan" text-anchor="middle">DET. BACKTEST</text>
  <text x="732" y="112" class="dim" text-anchor="middle">Integer ticks</text>

  <!-- Second row — Entropy + Lean + WORM -->
  <!-- True Entropy block -->
  <rect x="20" y="145" width="220" height="55" rx="3" fill="#0a0a00" stroke="#ffd700" stroke-width="1.5"/>
  <text x="130" y="160" class="gold" text-anchor="middle" filter="url(#glow)">TRUE ENTROPY</text>
  <text x="130" y="174" class="dim" text-anchor="middle">H = log₂N − (1/N)Σcᵢlog₂cᵢ</text>
  <text x="130" y="188" class="dim" text-anchor="middle">Symbolic · Interval [L,U] · MPFR</text>

  <!-- Lean 4 block -->
  <rect x="260" y="145" width="200" height="55" rx="3" fill="#000a0a" stroke="#00ffff" stroke-width="1.5"/>
  <text x="360" y="160" class="cyan" text-anchor="middle" filter="url(#glow)">LEAN 4 VALIDATION</text>
  <text x="360" y="174" class="dim" text-anchor="middle">∀ noise ∈ EntropyBound,</text>
  <text x="360" y="188" class="dim" text-anchor="middle">PnL(f, data+noise) &gt; 0</text>

  <!-- WORM block -->
  <rect x="480" y="145" width="300" height="55" rx="3" fill="#0a0000" stroke="#00ff41" stroke-width="1.5">
    <animate attributeName="stroke" values="#00ff41;#005510;#00ff41" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="630" y="160" class="sub" text-anchor="middle" filter="url(#glow)">BIFROST WORM REGISTRY</text>
  <text x="630" y="174" class="dim" text-anchor="middle">SHA-256 chain · ZK-Attestation</text>
  <text x="630" y="188" class="dim" text-anchor="middle">Every factor sealed · immutable</text>

  <!-- Phi equation -->
  <rect x="20" y="218" width="760" height="30" rx="2" fill="#050505" stroke="#333" stroke-width="1"/>
  <text x="400" y="237" class="gold" text-anchor="middle" filter="url(#glow)">
    φ⁻¹ + φ⁻² = 1  ·  p(5k+4) ≡ 0 (mod 5)  ·  |aₚ| ≤ 2p^((k-1)/2)  ·  [U,ρ*] = 0
  </text>

  <!-- Stats row -->
  <text x="30" y="270" class="sub">CRATES</text>
  <text x="30" y="284" class="dim">quantabeta-core</text>
  <text x="30" y="296" class="dim">true-entropy</text>
  <text x="30" y="308" class="dim">ramanujan-ops</text>
  <text x="30" y="320" class="dim">quantabeta-backtest</text>

  <text x="180" y="270" class="sub">ARITHMETIC</text>
  <text x="180" y="284" class="dim">rug::Rational (exact)</text>
  <text x="180" y="296" class="dim">MPFR 256-bit</text>
  <text x="180" y="308" class="dim">No f64. Ever.</text>
  <text x="180" y="320" class="red">Float banned ✗</text>

  <text x="340" y="270" class="sub">INVARIANTS</text>
  <text x="340" y="284" class="dim">Ramanujan p(5k+4)≡0(mod5) ✓</text>
  <text x="340" y="296" class="dim">Ramanujan p(7k+5)≡0(mod7) ✓</text>
  <text x="340" y="308" class="dim">Deligne Hecke bound ✓</text>
  <text x="340" y="320" class="dim">Rogers-Ramanujan identity ✓</text>

  <text x="580" y="270" class="sub">VERIFICATION</text>
  <text x="580" y="284" class="dim">Lean 4 robustness theorem</text>
  <text x="580" y="296" class="dim">LiquidHaskell compile-time</text>
  <text x="580" y="308" class="dim">Prolog DCG synthesis</text>
  <text x="580" y="320" class="dim">OEIS A000041 tested ✓</text>

  <!-- Bottom bar -->
  <rect x="0" y="345" width="800" height="55" fill="#000500"/>
  <line x1="0" y1="345" x2="800" y2="345" stroke="#00ff41" stroke-width="1"/>

  <!-- Scrolling ticker -->
  <text x="800" y="362" class="dim" filter="url(#glow)">
    QuantaBeta · Sovereign Quant · No LLM Alpha · Exact Arithmetic · Ramanujan · Hecke · Jordan · φ = (1+√5)/2 · WORM Sealed · Bifrost · Lean 4 · LiquidHaskell · Zero Float ·
    <animate attributeName="x" values="800;-3000" dur="20s" repeatCount="indefinite"/>
  </text>

  <text x="20" y="383" class="dim">Ahmad Ali Parr · Bel Esprit D'Accord Irrevocable Trust · EIN 42-697643</text>
  <text x="580" y="383" class="dim">
    Ω = TRUST ∧ CODE
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- Scanlines overlay -->
  <rect width="800" height="400" fill="url(#scanlines)" opacity="0.4"/>

  <!-- Corner brackets -->
  <path d="M0,0 L20,0 M0,0 L0,20" stroke="#00ff41" stroke-width="2" fill="none"/>
  <path d="M800,0 L780,0 M800,0 L800,20" stroke="#00ff41" stroke-width="2" fill="none"/>
  <path d="M0,400 L20,400 M0,400 L0,380" stroke="#00ff41" stroke-width="2" fill="none"/>
  <path d="M800,400 L780,400 M800,400 L800,380" stroke="#00ff41" stroke-width="2" fill="none"/>

  <!-- Pulsing dot top-right -->
  <circle cx="775" cy="20" r="4" fill="#00ff41">
    <animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="762" y="18" class="dim" text-anchor="end">LIVE</text>
</svg>
