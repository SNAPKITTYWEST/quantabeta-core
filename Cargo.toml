[workspace]
members = [
    "crates/quantabeta-core",
    "crates/quantabeta-backtest",
]
resolver = "2"

[workspace.dependencies]
rug        = { version = "1.24", features = ["rational"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1"
sha2       = "0.10"
hex        = "0.4"
